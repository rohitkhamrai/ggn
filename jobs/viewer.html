<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Jewelry CAD Studio</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #1a1a1a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(24, 24, 27, 0.88);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: #0284c7;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #0369a1; }
    .btn.secondary { background: #3f3f46; }
    .btn.secondary:hover { background: #52525b; }
    .btn.view-btn { background: #059669; }
    .btn.view-btn:hover { background: #047857; }
    .status {
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
  <div id="ui">
    <h2>Procedural Jewelry Studio CAD</h2>
    <div class="btn-group">
      <button class="btn" onclick="buildSolitaireRing()">Solitaire (57-Facet)</button>
      <button class="btn" onclick="buildInterlockingChain()">Cable Chain</button>
      <button class="btn" onclick="buildCharmBracelet()">Charm Bracelet</button>
      <button class="btn view-btn" onclick="setTopView()">Top View</button>
      <button class="btn view-btn" onclick="setPerspectiveView()">3D Angle</button>
    </div>
    <div id="status" class="status">Procedural geometry active</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // TASK 1: PMREMGenerator + RoomEnvironment + Tone Mapping
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const env = pmrem.fromScene(new THREE.RoomEnvironment()).texture;
    scene.environment = env;
    scene.background = new THREE.Color(0x1a1a1a);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;

    // Materials
    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xFFD700,
      metalness: 1.0,
      roughness: 0.05
    });

    const gemMat = new THREE.MeshPhysicalMaterial({
      color: 0x0033ff,
      transmission: 1.0,
      ior: 2.417,
      roughness: 0.0,
      thickness: 3.0,
      envMapIntensity: 3.0
    });

    // Soft contact shadow: flat PlaneGeometry below ring, MeshBasicMaterial opacity=0.3, black
    const shadowGeo = new THREE.PlaneGeometry(120, 120);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.3,
      depthWrite: false
    });
    const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = -10.0;
    scene.add(shadowPlane);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    // 1. Procedural D-Profile Cross Section for Comfort-fit Rings
    function createDWireProfile(width = 2.2, height = 1.6) {
      const shape = new THREE.Shape();
      const hw = width / 2;
      const hh = height / 2;
      shape.moveTo(-hw, -hh);
      shape.lineTo(hw, -hh);
      shape.quadraticCurveTo(hw, hh, 0, hh);
      shape.quadraticCurveTo(-hw, hh, -hw, -hh);
      return shape;
    }

    function sweepProfileAlongCurve(shape, curve, steps = 120) {
      const extrudeSettings = {
        steps: steps,
        bevelEnabled: false,
        extrudePath: curve
      };
      return new THREE.ExtrudeGeometry(shape, extrudeSettings);
    }

    // 2. 57-Facet Round Brilliant Diamond (BufferGeometry with indexed triangles)
    // 8 crown facets x 8 segments + table octagon + 8 pavilion x 8 + culet point
    function createBrilliantGem(diameter = 6.5, crownHeight = 1.0, pavilionDepth = 2.4) {
      const geom = new THREE.BufferGeometry();
      const r = diameter / 2.0;
      const verts = [];
      const indices = [];

      // 0: Culet point
      verts.push(0.0, 0.0, -pavilionDepth);

      // 1..16: Girdle 16 points (z = 0)
      for (let k = 0; k < 16; k++) {
        const a = k * Math.PI / 8.0;
        verts.push(r * Math.cos(a), r * Math.sin(a), 0.0);
      }

      // 17..24: 8 Table points (z = crownHeight)
      const rTable = r * 0.55;
      for (let j = 0; j < 8; j++) {
        const a = (2 * j) * Math.PI / 8.0;
        verts.push(rTable * Math.cos(a), rTable * Math.sin(a), crownHeight);
      }

      // 25..32: 8 Star apex points (z = crownHeight * 0.5)
      const rStar = r * 0.75;
      const hStar = crownHeight * 0.5;
      for (let j = 0; j < 8; j++) {
        const a = (2 * j + 1) * Math.PI / 8.0;
        verts.push(rStar * Math.cos(a), rStar * Math.sin(a), hStar);
      }

      // 33: Table Center
      verts.push(0.0, 0.0, crownHeight);

      // Table (8 triangles)
      for (let j = 0; j < 8; j++) {
        indices.push(33, 17 + j, 17 + (j + 1) % 8);
      }

      // 8 Star facets
      for (let j = 0; j < 8; j++) {
        indices.push(25 + j, 17 + j, 17 + (j + 1) % 8);
      }

      // 8 Kite (bezel) facets (16 triangles)
      for (let j = 0; j < 8; j++) {
        const t = 17 + j;
        const g = 1 + (2 * j);
        const sLeft = 25 + (j + 7) % 8;
        const sRight = 25 + j;
        indices.push(t, g, sRight);
        indices.push(t, sLeft, g);
      }

      // 16 Upper girdle facets
      for (let j = 0; j < 8; j++) {
        const s = 25 + j;
        const gLeft = 1 + (2 * j);
        const gMid = 1 + (2 * j + 1);
        const gRight = 1 + (2 * j + 2) % 16;
        indices.push(s, gLeft, gMid);
        indices.push(s, gMid, gRight);
      }

      // Pavilion: 16 facets meeting at culet point
      for (let k = 0; k < 16; k++) {
        indices.push(0, 1 + (k + 1) % 16, 1 + k);
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function createFacetedCollet(seatDiameter = 6.5, height = 3.2, wall = 0.6) {
      const rOuter = (seatDiameter / 2) + wall;
      const rInner = seatDiameter / 2;
      const rBase = rOuter * 0.75;
      const geom = new THREE.CylinderGeometry(rOuter, rBase, height, 16, 1, true);
      geom.computeVertexNormals();
      return geom;
    }

    function resetModel() {
      modelGroup.clear();
    }

    function updateCameraAndShadow() {
      modelGroup.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(modelGroup);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      
      shadowPlane.position.y = box.min.y - 0.05;
      shadowPlane.position.x = center.x;
      shadowPlane.position.z = center.z;

      const maxY = Math.max(box.max.y, 8.0);
      const camDist = maxY * 3.5;

      camera.position.set(center.x + camDist * 0.6, center.y + camDist * 0.8, center.z + camDist * 0.9);
      controls.target.copy(center);
      controls.autoRotate = false;
      controls.update();
    }

    function setTopView() {
      const box = new THREE.Box3().setFromObject(modelGroup);
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(box.max.y * 3.5, 25);
      
      camera.position.set(center.x, center.y, center.z + maxDim);
      camera.up.set(0, 1, 0);
      controls.target.copy(center);
      controls.update();
    }

    function setPerspectiveView() {
      updateCameraAndShadow();
    }

    function buildSolitaireRing() {
      resetModel();

      const ringRadius = 8.65;
      const curve = new THREE.EllipseCurve(0, 0, ringRadius, ringRadius, 0, 2 * Math.PI, false, 0);
      const points = curve.getPoints(120).map(p => new THREE.Vector3(p.x, p.y, 0));
      const closedPath = new THREE.CatmullRomCurve3(points, true);

      const dProfile = createDWireProfile(2.2, 1.6);
      const shankGeom = sweepProfileAlongCurve(dProfile, closedPath);
      const shankMesh = new THREE.Mesh(shankGeom, goldMat);
      modelGroup.add(shankMesh);

      const colletGeom = createFacetedCollet(6.5, 3.2, 0.6);
      const colletMesh = new THREE.Mesh(colletGeom, goldMat);
      colletMesh.rotation.x = Math.PI / 2;
      colletMesh.position.set(0, ringRadius + 0.8, 0);
      modelGroup.add(colletMesh);

      const gemGeom = createBrilliantGem(6.5, 1.0, 2.4);
      const gemMesh = new THREE.Mesh(gemGeom, gemMat);
      gemMesh.rotation.x = Math.PI / 2;
      gemMesh.position.set(0, ringRadius + 1.2, 0);
      modelGroup.add(gemMesh);

      updateCameraAndShadow();
      document.getElementById('status').innerText = "Built: Solitaire Ring (D-wire shank + 57-facet brilliant diamond)";
    }

    function buildInterlockingChain(numLinks = 14) {
      resetModel();
      const majorR = 2.4;
      const wireR = 0.45;
      const stepX = (majorR - wireR) * 1.75;

      for (let i = 0; i < numLinks; i++) {
        const linkGeom = new THREE.TorusGeometry(majorR, wireR, 16, 48);
        const linkMesh = new THREE.Mesh(linkGeom, goldMat);
        linkMesh.position.x = i * stepX;
        if (i % 2 === 1) linkMesh.rotation.x = Math.PI / 2;
        modelGroup.add(linkMesh);
      }

      updateCameraAndShadow();
      document.getElementById('status').innerText = `Built: Interlocking Cable Chain (${numLinks} links)`;
    }

    function buildCharmBracelet() {
      resetModel();
      const claspCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-7.5, 0, 0),
        new THREE.Vector3(-3.75, 0.8, 0),
        new THREE.Vector3(0, 0, 0)
      ]);
      const claspGeom = new THREE.TubeGeometry(claspCurve, 32, 0.7, 16, false);
      const claspMesh = new THREE.Mesh(claspGeom, goldMat);
      modelGroup.add(claspMesh);

      const majorR = 2.3;
      const wireR = 0.45;
      const stepX = (majorR - wireR) * 1.75;

      for (let i = 0; i < 16; i++) {
        const posX = i * stepX;
        if (i % 4 === 3) {
          const beadGeom = new THREE.SphereGeometry(1.8, 32, 32);
          const beadMesh = new THREE.Mesh(beadGeom, goldMat);
          beadMesh.position.set(posX, 0, 0);
          modelGroup.add(beadMesh);
        } else {
          const linkGeom = new THREE.TorusGeometry(majorR, wireR, 16, 48);
          const linkMesh = new THREE.Mesh(linkGeom, goldMat);
          linkMesh.position.set(posX, 0, 0);
          if (i % 2 === 1) linkMesh.rotation.x = Math.PI / 2;
          modelGroup.add(linkMesh);

          if (i === 4 || i === 10) {
            const charmDisc = new THREE.CylinderGeometry(1.8, 1.8, 0.5, 32);
            const charmMesh = new THREE.Mesh(charmDisc, goldMat);
            charmMesh.position.set(posX, -majorR - 2.0, 0);
            charmMesh.rotation.x = Math.PI / 2;
            modelGroup.add(charmMesh);

            const ringGeom = new THREE.TorusGeometry(0.8, 0.2, 12, 24);
            const ringMesh = new THREE.Mesh(ringGeom, goldMat);
            ringMesh.position.set(posX, -majorR - 0.7, 0);
            modelGroup.add(ringMesh);
          }
        }
      }

      updateCameraAndShadow();
      document.getElementById('status').innerText = "Built: Charm Bracelet";
    }

    // Support loading CAD design STLs directly if ?design= or ?assembly= provided
    async function loadCadDesign(path) {
      resetModel();
      document.getElementById('status').innerText = `Loading CAD design from ${path}...`;
      const loader = new THREE.STLLoader();
      let basePath = path;
      if (basePath.endsWith('assembly.json')) {
        basePath = basePath.substring(0, basePath.lastIndexOf('/') + 1);
      } else if (!basePath.endsWith('/')) {
        basePath += '/';
      }
      
      const loadMesh = (url, mat) => new Promise((resolve, reject) => {
        loader.load(url, (geom) => {
          geom.computeVertexNormals();
          const mesh = new THREE.Mesh(geom, mat);
          resolve(mesh);
        }, undefined, reject);
      });

      try {
        const metalMesh = await loadMesh(basePath + 'metal.stl', goldMat);
        modelGroup.add(metalMesh);

        try {
          const gemMesh = await loadMesh(basePath + 'gems/gem_0.stl', gemMat);
          modelGroup.add(gemMesh);
        } catch (e) {
          console.warn("No gem_0.stl found");
        }

        updateCameraAndShadow();
        document.getElementById('status').innerText = `Loaded CAD design: ${basePath}`;
      } catch (err) {
        console.error("Failed to load design:", err);
        buildSolitaireRing();
      }
    }

    // Check URL search params
    const params = new URLSearchParams(window.location.search);
    const designParam = params.get('design') || params.get('assembly');
    if (designParam) {
      loadCadDesign(designParam);
    } else {
      buildSolitaireRing();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
